<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Innova Carty · flow diagram</title>
<link rel="stylesheet" href="../app/fonts/fonts.css">
<link rel="stylesheet" href="../app/styles.css">
<style>
  body { background: #fff; }
  #board { position: relative; padding: 0; }
  .head { padding: 32px 40px 8px; display: flex; gap: 32px; align-items: flex-start; }
  .head h1 { font-size: 28px; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; margin-top: 10px; max-width: 980px; }
  .meta b { color: var(--ink-2); font-weight: 500; }
  .legend { margin-left: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); padding-top: 6px; }
  .legend i { display: inline-block; width: 34px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 8px; }
  .canvas { position: relative; margin: 8px 40px 40px; }
  .node { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .node.scr img { width: 100%; border: 1px solid #BCCCDC; border-radius: 10px; box-shadow: 0 4px 14px rgba(16,42,67,.12); background: #fff; display: block; }
  .node.scr.ma img { border-radius: 18px; }
  .node.scr .cap { font: 500 13px var(--font-body); color: var(--ink-2); margin-top: 8px; white-space: nowrap; }
  .node.decision .dia { position: absolute; inset: 0; transform: rotate(45deg) scale(.707); background: #FFF8E6; border: 2.5px solid #F39C12; border-radius: 10px; }
  .node.decision span { position: relative; font: 600 13px var(--font-title); padding: 0 22px; color: var(--ink); }
  .node.start, .node.end { border-radius: 28px; background: var(--primary); color: #fff; font: 600 14px var(--font-title); padding: 0 16px; }
  .node.end { background: var(--secondary); }
  .node.action { border-radius: 10px; border: 2px dashed #E74C3C; background: #FDECEA; font-size: 13px; padding: 10px 14px; color: #7A1E14; }
  .wf .node.decision .dia { background: #F3F3F3; border-color: #8C8C8C; }
  svg.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, -50%); background: #fff; font: 500 12px var(--font-body); color: var(--ink); padding: 2px 6px; border-radius: 6px; width: max-content; max-width: 160px; text-align: center; line-height: 1.3; }
  .lbl.alt { color: #B3261E; } .lbl.happy { color: #00784A; }
</style>
</head>
<body>
<div id="board"></div>
<script src="../app/kit.js"></script>
<script src="../app/landing.js"></script>
<script src="../app/mobile.js"></script>
<script src="../app/cart-display.js"></script>
<script src="../app/console.js"></script>
<script src="flows.js"></script>
<script>
// diagram.html?flow=<id>&kind=wireflow|userflow
const q = new URLSearchParams(location.search);
const F = FLOWS[q.get('flow')], kind = q.get('kind') || 'userflow';
const IMG = kind === 'wireflow' ? 'wireframes' : 'mockups';
const SIZE = { cd: [300, 176], ma: [150, 325], wa: [320, 200] };
const COLGAP = kind === 'wireflow' ? 250 : 120, ROWGAP = 110;

let nodes, edges;
if (kind === 'wireflow') {
  nodes = []; edges = [];
  F.wireflow.forEach((row, r) => row.forEach(([screen, action], c) => {
    const id = `${r}-${c}`;
    nodes.push({ id, type: 'screen', screen, c, r });
    if (action && c < row.length - 1) edges.push([id, `${r}-${c + 1}`, action, 'flow']);
  }));
  (F.wireflowLinks || []).forEach(([a, b, l]) => {
    const na = nodes.find((n) => n.screen === a), nb = nodes.find((n) => n.screen === b);
    edges.push([na.id, nb.id, l, 'flow', 'b-t']);
  });
} else { nodes = F.nodes; edges = F.edges; }

const size = (n) => n.type === 'screen' ? [SIZE[n.screen.slice(0, 2)][0], SIZE[n.screen.slice(0, 2)][1] + 28]
  : n.type === 'decision' ? [140, 140] : n.type === 'action' ? [200, 96] : [170, 56];

const rows = [...new Set(nodes.map((n) => n.r))].sort((a, b) => a - b);
const cols = Math.max(...nodes.map((n) => n.c)) + 1;
const colW = Array.from({ length: cols }, (_, c) => Math.max(0, ...nodes.filter((n) => n.c === c).map((n) => size(n)[0])));
const rowH = {}; rows.forEach((r) => (rowH[r] = Math.max(...nodes.filter((n) => n.r === r).map((n) => size(n)[1]))));
const colX = []; let x = 0; colW.forEach((w, i) => { colX[i] = x + w / 2; x += w + COLGAP; });
const rowY = {}; let y = 0; rows.forEach((r) => { rowY[r] = y + rowH[r] / 2; y += rowH[r] + ROWGAP; });
const W = x - COLGAP, H = y - ROWGAP;

const box = {};
nodes.forEach((n) => {
  const [w, h] = size(n);
  // Screens align their image (not caption) on the row's center line.
  const cy = n.type === 'screen' ? rowY[n.r] + 14 : rowY[n.r];
  box[n.id] = { x: colX[n.c] - w / 2, y: cy - h / 2, w, h, n };
});

const head = `<div class="head${kind === 'wireflow' ? ' wf' : ''}"><div>
  <span class="caption" style="font-weight:600;letter-spacing:1.5px;color:var(--secondary)">${kind === 'wireflow' ? 'WIREFLOW' : 'USER FLOW'}</span>
  <h1>${F.title}</h1>
  <div class="meta"><b>User goal</b><span>${F.goal}</span><b>User persona</b><span>${F.persona}</span><b>User stories</b><span>${F.stories}</span></div></div>
  <div class="legend">${kind === 'wireflow'
    ? '<span><i style="border-color:#486581"></i>Interaction that changes the screen</span>'
    : '<span><i style="border-color:#102A43"></i>Happy path</span><span><i style="border-color:#009E60"></i>Alternative path</span><span><i style="border-color:#E74C3C;border-top-style:dashed"></i>Unhappy path</span><span>◇ Decision · ▭ dashed: system response</span>'}</div></div>`;

let html = '';
nodes.forEach((n) => {
  const b = box[n.id];
  const st = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`;
  if (n.type === 'screen') html += `<div class="node scr ${n.screen.slice(0, 2)}" style="${st};justify-content:flex-start"><img src="../../../assets/chapter-5/${IMG}/${n.screen}.png"><span class="cap">${IC.SCREENS[n.screen].app} · ${IC.SCREENS[n.screen].title}</span></div>`;
  else if (n.type === 'decision') html += `<div class="node decision" style="${st}"><div class="dia"></div><span>${n.label}</span></div>`;
  else html += `<div class="node ${n.type}" style="${st}">${n.label}</div>`;
});

// Orthogonal edge routing between named ports (r, l, t, b).
const port = (b, p) => {
  const imgH = b.n.type === 'screen' ? b.h - 28 : b.h;
  return { r: [b.x + b.w, b.y + imgH / 2], l: [b.x, b.y + imgH / 2], t: [b.x + b.w / 2, b.y], b: [b.x + b.w / 2, b.y + b.h] }[p];
};
const COLORS = { flow: '#486581', happy: '#009E60', alt: '#E74C3C', main: '#102A43' };
let svg = '', labels = '';
edges.forEach(([a, b, label, tone = 'main', ports]) => {
  const A = box[a], B = box[b];
  if (!ports) ports = B.x > A.x + A.w / 2 ? 'r-l' : B.y > A.y ? 'b-t' : 't-b';
  const [pa, pb] = ports.split('-');
  const p0 = port(A, pa), p1 = port(B, pb);
  const horiz = (p) => p === 'r' || p === 'l';
  let pts;
  if (pa === pb) {
    const off = 40, d = { b: [0, 1], t: [0, -1], r: [1, 0], l: [-1, 0] }[pa];
    const ext = pa === 'b' ? Math.max(p0[1], p1[1]) + off : pa === 't' ? Math.min(p0[1], p1[1]) - off : pa === 'r' ? Math.max(p0[0], p1[0]) + off : Math.min(p0[0], p1[0]) - off;
    pts = horiz(pa) ? [p0, [ext, p0[1]], [ext, p1[1]], p1] : [p0, [p0[0], ext], [p1[0], ext], p1];
  } else if (horiz(pa) && horiz(pb)) { const mx = (p0[0] + p1[0]) / 2; pts = [p0, [mx, p0[1]], [mx, p1[1]], p1]; }
  else if (!horiz(pa) && !horiz(pb)) { const my = (p0[1] + p1[1]) / 2; pts = [p0, [p0[0], my], [p1[0], my], p1]; }
  else if (horiz(pa)) pts = [p0, [p1[0], p0[1]], p1];
  else pts = [p0, [p0[0], p1[1]], p1];
  const c = COLORS[tone];
  svg += `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" ${tone === 'alt' ? 'stroke-dasharray="7 5"' : ''} marker-end="url(#m-${tone})" stroke-linejoin="round"/>`;
  if (label) {
    let best = 0, bi = 0;
    for (let i = 0; i < pts.length - 1; i++) { const L = Math.abs(pts[i + 1][0] - pts[i][0]) + Math.abs(pts[i + 1][1] - pts[i][1]); if (L > best) { best = L; bi = i; } }
    const mx = (pts[bi][0] + pts[bi + 1][0]) / 2, my = (pts[bi][1] + pts[bi + 1][1]) / 2;
    labels += `<div class="lbl ${tone}" style="left:${mx}px;top:${my}px">${label}</div>`;
  }
});
const markers = Object.entries(COLORS).map(([k, c]) => `<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('');

document.getElementById('board').innerHTML = head +
  `<div class="canvas" style="width:${W}px;height:${H + 70}px"><svg class="edges" width="${W}" height="${H}"><defs>${markers}</defs>${svg}</svg>${html}${labels}</div>`;
document.getElementById('board').style.width = Math.max(W + 80, 1200) + 'px';
Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = '1'));
</script>
</body>
</html>
